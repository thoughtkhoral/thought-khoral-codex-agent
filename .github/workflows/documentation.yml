name: Documentation and specification checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify specifications and maintained documentation
        run: python3 scripts/check_docs.py
      - name: Verify patch formatting
        run: git show --format= --check HEAD
